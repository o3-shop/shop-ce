  OxidEsales\EshopCommunity\Internal\Framework\Twig\Extensions\Filters\PhpFunctionsExtension:
    class: OxidEsales\EshopCommunity\Internal\Framework\Twig\Extensions\Filters\PhpFunctionsExtension
