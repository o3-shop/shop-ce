    arguments:
      - '@OxidEsales\EshopCommunity\Internal\Transition\Adapter\TemplateLogic\TruncateLogic'
    tags: ['twig.extension']

  OxidEsales\EshopCommunity\Internal\Framework\Twig\Extensions\Filters\TranslateSalutationExtension:
    class: OxidEsales\EshopCommunity\Internal\Framework\Twig\Extensions\Filters\TranslateSalutationExtension
    arguments:
      - '@OxidEsales\EshopCommunity\Internal\Transition\Adapter\TemplateLogic\TranslateSalutationLogic'
    tags: ['twig.extension']

  OxidEsales\EshopCommunity\Internal\Framework\Twig\Extensions\Filters\FormatCurrencyExtension:
    class: OxidEsales\EshopCommunity\Internal\Framework\Twig\Extensions\Filters\FormatCurrencyExtension
    arguments:
      - '@OxidEsales\EshopCommunity\Internal\Transition\Adapter\TemplateLogic\FormatCurrencyLogic'
    tags: ['twig.extension']

  OxidEsales\EshopCommunity\Internal\Framework\Twig\Extensions\Filters\WordwrapExtension:
    class: OxidEsales\EshopCommunity\Internal\Framework\Twig\Extensions\Filters\WordwrapExtension
    arguments:
      - '@OxidEsales\EshopCommunity\Internal\Transition\Adapter\TemplateLogic\WordwrapLogic'
    tags: ['twig.extension']

  OxidEsales\EshopCommunity\Internal\Framework\Twig\Extensions\IncludeWidgetExtension:
    class: OxidEsales\EshopCommunity\Internal\Framework\Twig\Extensions\IncludeWidgetExtension
    arguments:
      - '@OxidEsales\EshopCommunity\Internal\Transition\Adapter\TemplateLogic\IncludeWidgetLogic'
    tags: ['twig.extension']

  OxidEsales\EshopCommunity\Internal\Framework\Twig\Extensions\Filters\SmartWordwrapExtension:
    class: OxidEsales\EshopCommunity\Internal\Framework\Twig\Extensions\Filters\SmartWordwrapExtension
