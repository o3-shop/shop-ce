  OxidEsales\EshopCommunity\Internal\Framework\Twig\Extensions\GetRequestVariablesExtension:
    class: OxidEsales\EshopCommunity\Internal\Framework\Twig\Extensions\GetRequestVariablesExtension
    tags: ['twig.extension']

  # Engine (extensions are added by TwigEnvironmentPass, escapers by TwigEscaperPass). Deliberately not bound to TemplateEngineInterface: the engine is selected elsewhere.

  oxid_esales.templating.twig_engine:
    class: OxidEsales\EshopCommunity\Internal\Framework\Twig\TwigEngine
    arguments:
      - '@twig'
    public: true
