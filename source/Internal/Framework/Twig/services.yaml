services:
  _defaults:
    autowire: false
    public: false

  OxidEsales\Eshop\Core\Config:
    class: OxidEsales\Eshop\Core\Config
    factory: ['OxidEsales\Eshop\Core\Registry', getConfig]

  OxidEsales\Eshop\Core\UtilsView:
    class: OxidEsales\Eshop\Core\UtilsView
    factory: ['OxidEsales\Eshop\Core\Registry', getUtilsView]

  OxidEsales\EshopCommunity\Internal\Framework\Twig\TwigContextInterface:
    class: OxidEsales\EshopCommunity\Internal\Framework\Twig\TwigContext
    arguments:
      - '@OxidEsales\Eshop\Core\Config'
      - '@OxidEsales\Eshop\Core\UtilsView'

  OxidEsales\EshopCommunity\Internal\Framework\Twig\TwigEngineConfigurationInterface:
    class: OxidEsales\EshopCommunity\Internal\Framework\Twig\TwigEngineConfiguration
    arguments:
      - '@OxidEsales\EshopCommunity\Internal\Framework\Twig\TwigContextInterface'

  # Plain arrays produced by factories, so no expression language is needed.
  twig.options:
    class: array
    factory: ['@OxidEsales\EshopCommunity\Internal\Framework\Twig\TwigEngineConfigurationInterface', getParameters]

  twig.template_directories:
    class: array
    factory: ['@OxidEsales\EshopCommunity\Internal\Framework\Twig\TwigContextInterface', getTemplateDirectories]

  twig:
    class: Twig\Environment
    arguments:
      - '@twig.loader'
      - '@twig.options'
    calls:
      - [addGlobal, ['twig', {capture: {}}]]
      - [addGlobal, ['oView', {}]]

  # Loaders. TwigLoaderPass aliases "twig.loader" to the tagged loader, or chains several tagged loaders.

  twig.loader.filesystem:
    class: OxidEsales\EshopCommunity\Internal\Framework\Twig\Loader\FilesystemLoader
    arguments:
      - '@twig.template_directories'
      - null
      - '@oxid_esales.templating.template.loader'
      - '@oxid_esales.templating.admin.template.loader'
    tags: ['twig.loader']

  twig.loader.chain:
    class: Twig\Loader\ChainLoader

  # Escapers

  OxidEsales\EshopCommunity\Internal\Framework\Twig\Escaper\DecEntityEscaper:
    tags: ['twig.escaper']

  OxidEsales\EshopCommunity\Internal\Framework\Twig\Escaper\HexEntityEscaper:
    tags: ['twig.escaper']

  OxidEsales\EshopCommunity\Internal\Framework\Twig\Escaper\HexEscaper:
    tags: ['twig.escaper']

  OxidEsales\EshopCommunity\Internal\Framework\Twig\Escaper\HtmlAllEscaper:
    tags: ['twig.escaper']

  OxidEsales\EshopCommunity\Internal\Framework\Twig\Escaper\MailEscaper:
    tags: ['twig.escaper']

  OxidEsales\EshopCommunity\Internal\Framework\Twig\Escaper\NonStdEscaper:
    tags: ['twig.escaper']

  OxidEsales\EshopCommunity\Internal\Framework\Twig\Escaper\QuotesEscaper:
    tags: ['twig.escaper']

  OxidEsales\EshopCommunity\Internal\Framework\Twig\Escaper\UrlPathInfoEscaper:
    tags: ['twig.escaper']

  # Token parsers

  OxidEsales\EshopCommunity\Internal\Framework\Twig\TokenParser\HasRightsTokenParser:
    class: OxidEsales\EshopCommunity\Internal\Framework\Twig\TokenParser\HasRightsTokenParser
    arguments:
      - 'OxidEsales\EshopCommunity\Internal\Framework\Twig\Node\HasRightsNode'

  # Extensions

  OxidEsales\EshopCommunity\Internal\Framework\Twig\Extensions\MathExtension:
    class: OxidEsales\EshopCommunity\Internal\Framework\Twig\Extensions\MathExtension
    tags: ['twig.extension']

  OxidEsales\EshopCommunity\Internal\Framework\Twig\Extensions\IncludeExtension:
    class: OxidEsales\EshopCommunity\Internal\Framework\Twig\Extensions\IncludeExtension
    arguments:
      - '@OxidEsales\EshopCommunity\Internal\Transition\Adapter\TemplateLogic\IncludeDynamicLogic'
    tags: ['twig.extension']

  OxidEsales\EshopCommunity\Internal\Framework\Twig\Extensions\SmartyCycleExtension:
    class: OxidEsales\EshopCommunity\Internal\Framework\Twig\Extensions\SmartyCycleExtension
    tags: ['twig.extension']

  OxidEsales\EshopCommunity\Internal\Framework\Twig\Extensions\MailtoExtension:
    class: OxidEsales\EshopCommunity\Internal\Framework\Twig\Extensions\MailtoExtension
    tags: ['twig.extension']

  OxidEsales\EshopCommunity\Internal\Framework\Twig\Extensions\UrlExtension:
    class: OxidEsales\EshopCommunity\Internal\Framework\Twig\Extensions\UrlExtension
    arguments:
      - '@OxidEsales\EshopCommunity\Internal\Transition\Adapter\TemplateLogic\SeoUrlLogic'
      - '@OxidEsales\EshopCommunity\Internal\Transition\Adapter\TemplateLogic\AddUrlParametersLogic'
    tags: ['twig.extension']

  OxidEsales\EshopCommunity\Internal\Framework\Twig\Extensions\AssignAdvancedExtension:
    class: OxidEsales\EshopCommunity\Internal\Framework\Twig\Extensions\AssignAdvancedExtension
    arguments:
      - '@OxidEsales\EshopCommunity\Internal\Transition\Adapter\TemplateLogic\AssignAdvancedLogic'
    tags: ['twig.extension']

  Twig\Extension\StringLoaderExtension:
    class: Twig\Extension\StringLoaderExtension
    tags: ['twig.extension']

  OxidEsales\EshopCommunity\Internal\Framework\Twig\Extensions\HasRightsExtension:
    class: OxidEsales\EshopCommunity\Internal\Framework\Twig\Extensions\HasRightsExtension
    arguments:
      - '@OxidEsales\EshopCommunity\Internal\Framework\Twig\TokenParser\HasRightsTokenParser'
    tags: ['twig.extension']

  OxidEsales\EshopCommunity\Internal\Framework\Twig\Extensions\IfContentExtension:
    class: OxidEsales\EshopCommunity\Internal\Framework\Twig\Extensions\IfContentExtension
    arguments:
      - '@OxidEsales\EshopCommunity\Internal\Transition\Adapter\TemplateLogic\IfContentLogic'
    tags: ['twig.extension']

  OxidEsales\EshopCommunity\Internal\Framework\Twig\Extensions\FormatPriceExtension:
    class: OxidEsales\EshopCommunity\Internal\Framework\Twig\Extensions\FormatPriceExtension
    arguments:
      - '@OxidEsales\EshopCommunity\Internal\Transition\Adapter\TemplateLogic\FormatPriceLogic'
    tags: ['twig.extension']

  OxidEsales\EshopCommunity\Internal\Framework\Twig\Extensions\Filters\CatExtension:
    class: OxidEsales\EshopCommunity\Internal\Framework\Twig\Extensions\Filters\CatExtension
    tags: ['twig.extension']

  OxidEsales\EshopCommunity\Internal\Framework\Twig\Extensions\Filters\EncloseExtension:
    class: OxidEsales\EshopCommunity\Internal\Framework\Twig\Extensions\Filters\EncloseExtension
    tags: ['twig.extension']

  OxidEsales\EshopCommunity\Internal\Framework\Twig\Extensions\ScriptExtension:
    class: OxidEsales\EshopCommunity\Internal\Framework\Twig\Extensions\ScriptExtension
    arguments:
      - '@OxidEsales\EshopCommunity\Internal\Transition\Adapter\TemplateLogic\ScriptLogic'
    tags: ['twig.extension']

  OxidEsales\EshopCommunity\Internal\Framework\Twig\Extensions\Filters\FormatDateExtension:
    class: OxidEsales\EshopCommunity\Internal\Framework\Twig\Extensions\Filters\FormatDateExtension
    arguments:
      - '@OxidEsales\EshopCommunity\Internal\Transition\Adapter\TemplateLogic\FormatDateLogic'
    tags: ['twig.extension']

  OxidEsales\EshopCommunity\Internal\Framework\Twig\Extensions\Filters\DateFormatExtension:
    class: OxidEsales\EshopCommunity\Internal\Framework\Twig\Extensions\Filters\DateFormatExtension
    arguments:
      - '@OxidEsales\EshopCommunity\Internal\Transition\Adapter\TemplateLogic\DateFormatHelper'
    tags: ['twig.extension']

  OxidEsales\EshopCommunity\Internal\Framework\Twig\Extensions\Filters\TranslateExtension:
    class: OxidEsales\EshopCommunity\Internal\Framework\Twig\Extensions\Filters\TranslateExtension
    arguments:
      - '@OxidEsales\EshopCommunity\Internal\Transition\Adapter\TemplateLogic\TranslateFilterLogic'
    tags: ['twig.extension']

  OxidEsales\EshopCommunity\Internal\Framework\Twig\Extensions\TranslateExtension:
    class: OxidEsales\EshopCommunity\Internal\Framework\Twig\Extensions\TranslateExtension
    arguments:
      - '@OxidEsales\EshopCommunity\Internal\Transition\Adapter\TemplateLogic\TranslateFunctionLogic'
    tags: ['twig.extension']

  OxidEsales\EshopCommunity\Internal\Framework\Twig\Extensions\Filters\FormatTimeExtension:
