    tags: ['twig.extension']

  OxidEsales\EshopCommunity\Internal\Framework\Twig\Extensions\Filters\FileSizeExtension:
    class: OxidEsales\EshopCommunity\Internal\Framework\Twig\Extensions\Filters\FileSizeExtension
    arguments:
      - '@OxidEsales\EshopCommunity\Internal\Transition\Adapter\TemplateLogic\FileSizeLogic'
    tags: ['twig.extension']

  OxidEsales\EshopCommunity\Internal\Framework\Twig\Extensions\StyleExtension:
    class: OxidEsales\EshopCommunity\Internal\Framework\Twig\Extensions\StyleExtension
