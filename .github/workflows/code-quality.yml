name: Code Quality

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  cs-fixer:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: 🐘 Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: ⬇️ Download PHP-CS-Fixer
        run: |
          wget -q https://github.com/FriendsOfPHP/PHP-CS-Fixer/releases/download/v3.66.0/php-cs-fixer.phar -O php-cs-fixer.phar
          chmod +x php-cs-fixer.phar
          sudo mv php-cs-fixer.phar /usr/local/bin/php-cs-fixer 

      - name: ℹ️ Show PHP-CS-Fixer version
        run: php-cs-fixer --version

      - name: 💅 Run Code Style Check (PHP-CS-Fixer)
        id: cs_check
        run: php-cs-fixer check
        continue-on-error: true

      - name: 📝 Save Code Style Results
        if: github.event_name == 'pull_request'
        run: |
          if [ "${{ steps.cs_check.outcome }}" == "failure" ]; then
            echo "FAILED" > cs-fixer-result.txt
          else
            echo "PASSED" > cs-fixer-result.txt
          fi

      - name: 📤 Upload Code Style Results
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: cs-fixer-result
          path: cs-fixer-result.txt
          retention-days: 1

      - name: 🔴 Fail if code style check failed
        if: steps.cs_check.outcome == 'failure'
        run: exit 1

  test:
    # Route ONLY the 8.2 coverage leg to the self-hosted runner, and only for
    # trusted pushes: never for fork PRs (they'd run untrusted code on our box)
    # and only when the triggering actor is on the allowlist. Everything else —
    # the 7.4/8.0/8.1 legs, fork PRs, and non-listed actors — uses the free
    # GitHub-hosted runners. The self-hosted box only ever runs one job at a time.
    runs-on: >-
      ${{ (matrix.php-version == '8.2'
           && github.event.pull_request.head.repo.fork != true
           && contains(fromJSON('["nlo-tronet"]'), github.actor))
          && 'self-hosted' || 'ubuntu-latest' }}

    strategy:
      matrix:
        php-version: ['7.4', '8.0', '8.1', '8.2']
      fail-fast: false

    services:
      mariadb:
        image: mariadb:10.10
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: o3shop_test
          MYSQL_USER: o3shop
          MYSQL_PASSWORD: o3shop
        ports:
          - 3306:3306
        # --tmpfs: put the DB data dir in RAM so the per-worker shop installs and
        #   the many restore cycles aren't disk-bound (big win on self-hosted).
        # Tighter healthcheck (3s interval + start-period) so the job proceeds as
        #   soon as MariaDB is actually up instead of rounding up to a 10s tick.
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=3s
          --health-timeout=4s
          --health-retries=15
          --health-start-period=8s
          --tmpfs /var/lib/mysql:rw,size=4g

    steps:
      - uses: actions/checkout@v7

      - name: 🐘 Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          # Full set the shop needs (mirrors docker/Dockerfile). Hosted PHP ships
          # most of these by default, so the short list worked there — but a minimal
          # self-hosted PHP install does not, which surfaced as missing bcmath (bcmod),
          # gd (imagecreatetruecolor), and soap (SoapFault) at test time.
          extensions: mbstring, xml, ctype, json, tokenizer, iconv, pdo, pdo_mysql, mysqli, gd, curl, bcmath, soap, bz2, intl, calendar, exif, zip
          # Coverage is identical across PHP versions (same source), so we compute
          # it on ONE leg (8.2) and run the others as plain parallel tests. Enable
          # the pcov driver only on that leg; 'none' keeps the others overhead-free.
          coverage: ${{ matrix.php-version == '8.2' && 'pcov' || 'none' }}
          # Match docker's default so exported env vars (e.g. O3SHOP_CONF_DBNAME)
          # are copied into $_ENV, which source/config.inc.php reads. Without the
          # 'E', an exported var isn't in $_ENV and Dotenv::createImmutable skips it
          # (it's already in getenv), so shop-install subprocesses see an empty DB.
          ini-values: variables_order=EGPCS

      - name: ⬇️ Install Composer 2.2
        run: |
          echo "::group::Install Composer"
          php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
          php composer-setup.php --version=2.2.28
          php -r "unlink('composer-setup.php');"
          sudo mv composer.phar /usr/local/bin/composer
          composer --version
          echo "::endgroup::"

      - name: 🏷 Set Dynamic Composer Root Version
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BRANCH_NAME="${{ github.head_ref }}"
          fi
          if [[ "$BRANCH_NAME" == "main" ]]; then
            VERSION="1.4.x-dev"
          elif [[ "$BRANCH_NAME" == *"1.4"* ]]; then
            VERSION="1.4.x-dev"
          elif [[ "$BRANCH_NAME" == *"1.3"* ]]; then
            VERSION="1.3.x-dev"
          else
            VERSION="1.4.x-dev"
          fi
          echo "COMPOSER_ROOT_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Using version: $VERSION"

      - name: 📦 Cache Composer Downloads
        uses: actions/cache@v6
        with:
          # composer.lock is committed and pinned to the PHP 7.4 platform floor
          # (config.platform.php), so `composer install` resolves the same tree
          # on every matrix leg. We cache only Composer's download cache and let
          # `vendor` rebuild fresh, so a re-resolve is never masked by a stale tree.
          path: ~/.cache/composer
          key: ${{ runner.os }}-php-${{ matrix.php-version }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php-version }}-composer-

      - name: 📦 Cache Vendor Directory
        uses: actions/cache@v6
        with:
          # vendor/ is a pure function of the committed, platform-pinned
          # composer.lock. Key on its exact hash with NO restore-keys: any
          # dependency change fully busts the cache, so a re-resolve is never
          # masked by a stale tree. composer install still runs (validates the
          # tree + dumps autoload) and the o3-theme dev-main require afterwards
          # keeps that one package fresh.
          path: vendor
          # Include runner.environment in the key: the testing-library patch below
          # differs between hosted and self-hosted (--skip-ssl kept vs stripped), and
          # that patched vendor gets cached — so the two environments must not share a
          # cache entry or a hosted-stripped copy would poison the self-hosted leg.
          key: ${{ runner.os }}-php-${{ matrix.php-version }}-${{ runner.environment }}-vendor-${{ hashFiles('composer.lock') }}

      - name: 🔧 Copy CI Config Files
        run: |
          cp .env.ci .env
          # .env.ci hardcodes the GitHub-hosted work dir (/home/runner/work/...).
          # Rewrite the shop paths to the actual checkout so this also works on
          # self-hosted runners, whose work dir differs (e.g.
          # /home/<user>/actions-runner/_work/...). $GITHUB_WORKSPACE is the
          # checkout path on ANY runner, so hosted legs are unaffected.
          sed -i "s#^O3SHOP_CONF_SHOPDIR=.*#O3SHOP_CONF_SHOPDIR=\"${GITHUB_WORKSPACE}/source\"#" .env
          sed -i "s#^O3SHOP_CONF_COMPILEDIR=.*#O3SHOP_CONF_COMPILEDIR=\"${GITHUB_WORKSPACE}/source/tmp\"#" .env
          cp source/config.inc.php.dist source/config.inc.php

      - name: 📥 Install Dependencies
        env:
          COMPOSER_ROOT_VERSION: ${{ env.COMPOSER_ROOT_VERSION }}
        run: |
          echo "::group::Composer Install"
          composer install --prefer-dist --no-progress
          echo "::endgroup::"
          echo "::group::Install O3-Theme"
          composer require o3-shop/o3-theme:dev-main --prefer-dist --no-progress
          echo "::endgroup::"
          echo "::group::Apt Install"
          # xmllint (libxml2-utils) is the only apt need; skip the ~apt-get update
          # + install when it's already present (persistent self-hosted runners keep
          # it between runs, hosted runners install it once per fresh VM).
          command -v xmllint >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y libxml2-utils; }
          echo "::endgroup::"

      - name: 🎨 Install Wave Theme
        run: |
          echo "::group::Wave Theme Installation"
          # Always install fresh. Do NOT skip when the dir exists: the wave theme is
          # gitignored (downloaded, not committed), so on a persistent self-hosted
          # runner a stale copy would survive between runs and get reused. An older
          # wave order_cust.tpl calls $basketitem->getArticle(), which throws
          # NOPRODUCTID against the mocked basket in the order-email tests — errors
          # that never appear on fresh hosted runners. Wiping guarantees parity.
          rm -rf source/Application/views/wave wave-theme-main main.zip
          wget -q https://github.com/o3-shop/wave-theme/archive/refs/heads/main.zip -O main.zip
          unzip -q main.zip
          mkdir -p source/out/
          cp -r wave-theme-main/out/* source/out/
          mkdir -p source/Application/views/wave
          rm -rf wave-theme-main/out
          cp -r wave-theme-main/* source/Application/views/wave
          rm -rf wave-theme-main main.zip
          echo "Wave theme installed"
          echo "::endgroup::"

      - name: ⏳ Wait for MariaDB (Ready Check)
        run: |
          until mysqladmin ping -h 127.0.0.1 -P 3306 -u root -proot --silent; do
            echo 'Waiting for MariaDB...'
            sleep 1
          done

      - name: 🩹 Patch Testing Library (MariaDB SSL handling)
        run: |
            DBH=vendor/o3-shop/testing-library/library/Services/Library/DatabaseHandler.php
            if [ "${{ runner.environment }}" = "github-hosted" ]; then
              # Hosted uses the MySQL 8 client, which rejects --skip-ssl → strip it.
              # (The library ships mysql/mysqldump commands with --skip-ssl baked in.)
              sed -i "s/ --skip-ssl//g" "$DBH"
              grep -q "skip-ssl" "$DBH" && echo "WARN: --skip-ssl still present" || echo "hosted: --skip-ssl removed"
            else
              # Self-hosted uses the MariaDB client, which REQUIRES SSL unless told
              # otherwise. Those commands run with --defaults-file (so ~/.my.cnf's
              # skip-ssl is ignored) — the library's original command-line --skip-ssl
              # must stay. Just verify it's present (fresh/env-scoped-cached vendor).
              grep -q "skip-ssl" "$DBH" && echo "self-hosted: --skip-ssl kept" || echo "WARN: --skip-ssl missing on self-hosted!"
            fi

      - name: 🗄️ Create Test Databases (base + per-worker)
        run: |
          # CI runners have no virtiofs mount (unlike local docker), so ParaTest
          # parallelism actually pays off here. Give each worker its own database.
          # The self-hosted box sits at ~40-65% CPU with plenty of free RAM during
          # the run — workers block on the single MariaDB, not on CPU. Oversubscribe
          # cores there so idle cores pick up work while others wait. Hosted runners
          # stay 1:1 with their cores.
          if [ "${{ runner.environment }}" = "self-hosted" ]; then
            WORKERS=20
          else
            WORKERS=$(nproc); [ "$WORKERS" -gt 8 ] && WORKERS=8
          fi
          echo "PARATEST_WORKERS=$WORKERS" >> $GITHUB_ENV
          # Only the 8.2 leg computes coverage (see setup-php note); the rest just
          # prove the tests pass on their PHP version.
          if [ "${{ matrix.php-version }}" = "8.2" ]; then
            echo "IS_COVERAGE_LEG=true" >> $GITHUB_ENV
          else
            echo "IS_COVERAGE_LEG=false" >> $GITHUB_ENV
          fi
          mysql -h 127.0.0.1 -P 3306 -u root -proot -e "CREATE DATABASE IF NOT EXISTS o3shop_test;"
          for t in $(seq 1 "$WORKERS"); do
            mysql -h 127.0.0.1 -P 3306 -u root -proot -e "CREATE DATABASE IF NOT EXISTS o3shop_test_${t};"
            mkdir -p "source/tmp/paratest_${t}/smarty"
            if [ -d var/configuration ]; then cp -r var/configuration "var/configuration_${t}"; else mkdir -p "var/configuration_${t}/shops"; fi
          done
          # Ephemeral, tmpfs-backed DB: trade durability for speed, and raise the
          # connection cap for the oversubscribed worker pool + testing-library CLI
          # subprocesses. (Runtime SET GLOBAL because service containers can't take
          # server flags.)
          mysql -h 127.0.0.1 -P 3306 -u root -proot -e "SET GLOBAL innodb_flush_log_at_trx_commit=0; SET GLOBAL max_connections=512;" || true

      - name: ✅ Run ParaTest (parallel)
        id: phpunit
        continue-on-error: true
        run: |
          mkdir -p coverage
          export O3SHOP_CONF_DBNAME=o3shop_test   # per-worker bootstrap derives o3shop_test_<token>

          # One-time setup shared by all workers.
          php tests/bin/apply-parallel-patches.php
          php -r 'require "vendor/autoload.php"; \OxidEsales\TestingLibrary\TestConfig::prepareUnifiedNamespaceClasses();'

          if [ "$IS_COVERAGE_LEG" = "true" ]; then
            echo "::group::ParaTest + pcov coverage (-p ${PARATEST_WORKERS})"
            PCOV="-d pcov.enabled=1 -d pcov.directory=$PWD/source"
            # CLI opcode cache on every worker: each runs ~1000 test classes that
            # reload the same framework classes, so caching compiled opcodes (and
            # not stat-ing files) is a big win. JIT off (irrelevant under coverage).
            OPC="-d opcache.enable_cli=1 -d opcache.jit_buffer_size=0 -d opcache.validate_timestamps=0 -d opcache.max_accelerated_files=130000 -d opcache.memory_consumption=256"

            # Parallel run: everything except quarantine + the order-coupled group.
            # (ParaTest honours only the LAST --exclude-group, so combine them.)
            php $PCOV $OPC vendor/bin/paratest \
              -p "$PARATEST_WORKERS" --runner WrapperRunner \
              --bootstrap "$PWD/tests/paratest_bootstrap.php" \
              --passthru-php="$PCOV $OPC" \
              -c "$PWD/tests/phpunit.xml" \
              --exclude-group quarantine,parallel-unsafe \
              --coverage-php "$PWD/coverage/_parallel.cov" \
              --log-junit "$PWD/coverage/_junit_parallel.xml" \
              --path "$PWD/tests/Unit" || true

            # Serial run: the order-coupled @group parallel-unsafe tests.
            php $PCOV $OPC vendor/bin/phpunit \
              --bootstrap "$PWD/vendor/o3-shop/testing-library/bootstrap.php" \
              -c "$PWD/tests/phpunit.xml" \
              --exclude-group quarantine --group parallel-unsafe \
              --coverage-php "$PWD/coverage/_serial.cov" \
              --log-junit "$PWD/coverage/_junit_serial.xml" \
              "$PWD/tests/Unit" || true

            # Merge the two coverage sets + JUnit logs into one report, then expose
            # them at the paths the downstream steps expect. --no-html: the gate
            # only reads the Clover XML and nothing consumes the HTML artifact, so
            # skip the expensive whole-source HTML render.
            php tests/bin/merge-coverage.php --no-html
            cp coverage/coverage.xml coverage.xml
            cp coverage/junit.xml junit.xml
            echo "::endgroup::"
          else
            echo "::group::ParaTest (no coverage, -p ${PARATEST_WORKERS})"

            # Same split as the coverage leg, but no pcov: just prove the tests pass.
            php vendor/bin/paratest \
              -p "$PARATEST_WORKERS" --runner WrapperRunner \
              --bootstrap "$PWD/tests/paratest_bootstrap.php" \
              -c "$PWD/tests/phpunit.xml" \
              --exclude-group quarantine,parallel-unsafe \
              --log-junit "$PWD/coverage/_junit_parallel.xml" \
              --path "$PWD/tests/Unit" || true

            php vendor/bin/phpunit \
              --bootstrap "$PWD/vendor/o3-shop/testing-library/bootstrap.php" \
              -c "$PWD/tests/phpunit.xml" \
              --exclude-group quarantine --group parallel-unsafe \
              --log-junit "$PWD/coverage/_junit_serial.xml" \
              "$PWD/tests/Unit" || true

            # Combine the two JUnit logs (no coverage) so the failure gate can read it.
            php tests/bin/merge-coverage.php --junit-only
            cp coverage/junit.xml junit.xml
            echo "::endgroup::"
          fi

      - name: 📝 Parse Failed Tests
        id: parse_failed_tests
        run: |
          if [ -f junit.xml ]; then
            FAILURES=$(xmllint --xpath "count(//testcase[failure or error])" junit.xml 2>/dev/null || echo "0")
            ERROR_OUTPUT=$(
              xmllint --xpath '//testcase[failure or error]' junit.xml 2>/dev/null | tr '\n' ' ' | perl -ne '
              while (/<testcase\b([^>]*)>/g) {
                my $attr = $1;
                my ($class) = $attr =~ /\bclass="([^"]*)"/;
                my ($name)  = $attr =~ /\bname="([^"]*)"/;
                print "$class"."::"."$name\n" if $class && $name;
              }
              '
            )

            echo "FAILURES=$FAILURES"
            echo "ERROR_OUTPUT=$ERROR_OUTPUT"
             if [ "$FAILURES" -gt 0 ]; then
                echo "FAILED_TESTS=$ERROR_OUTPUT" >> $GITHUB_ENV
                echo "TESTS_FAILED=true" >> $GITHUB_ENV
              else
                echo "FAILED_TESTS=" >> $GITHUB_ENV
                echo "TESTS_FAILED=false" >> $GITHUB_ENV
              fi
            else
              echo "FAILED_TESTS=" >> $GITHUB_ENV
              echo "TESTS_FAILED=false" >> $GITHUB_ENV
            fi

      - name: 📝 Generate Coverage Summary
        if: env.IS_COVERAGE_LEG == 'true'
        run: |
          if [ -f coverage.xml ]; then
            COVERAGE=$(php -r "
              \$xml = simplexml_load_file('coverage.xml');
              \$metrics = \$xml->project->metrics;
              \$covered = (int)\$metrics['coveredstatements'];
              \$total = (int)\$metrics['statements'];
              \$percentage = \$total > 0 ? round((\$covered / \$total) * 100, 2) : 0;
              echo \$percentage;
            ")
            echo "## Coverage Report (PHP ${{ matrix.php-version }})" >> $GITHUB_STEP_SUMMARY
            echo "**Coverage: ${COVERAGE}%**" >> $GITHUB_STEP_SUMMARY
            echo "COVERAGE_PERCENTAGE=${COVERAGE}" >> $GITHUB_ENV
          else
            echo "No coverage file found"
          fi

      - name: 🛑 Enforce Coverage Threshold (≥ 90%)
        id: coverage_gate
        if: env.IS_COVERAGE_LEG == 'true' && env.TESTS_FAILED == 'false'
        run: php bin/check-coverage-threshold.php --clover coverage.xml --threshold 90

      - name: 💡 Add failed test summary if not PR
        if: env.TESTS_FAILED == 'true' && github.event_name != 'pull_request'
        run: |
          echo "## ❌ Some PHPUnit tests failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '${{ env.FAILED_TESTS }}' >> $GITHUB_STEP_SUMMARY

      - name: 📝 Save Test Results
        if: github.event_name == 'pull_request'
        run: |
          # Create JSON result for this PHP version
          cat > test-result-${{ matrix.php-version }}.json << EOF
          {
            "php_version": "${{ matrix.php-version }}",
            "coverage": "${{ env.COVERAGE_PERCENTAGE }}",
            "tests_failed": "${{ env.TESTS_FAILED }}",
            "failed_tests": "${{ env.FAILED_TESTS }}"
          }
          EOF

      - name: 📤 Upload Test Results
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: test-result-${{ matrix.php-version }}
          path: test-result-${{ matrix.php-version }}.json
          retention-days: 1

      - name: 🔴 Fail if tests failed
        if: env.TESTS_FAILED == 'true'
        run: exit 1

