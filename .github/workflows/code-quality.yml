name: Code Quality

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  cs-fixer:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 🐘 Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: ⬇️ Download PHP-CS-Fixer
        run: |
          wget -q https://github.com/FriendsOfPHP/PHP-CS-Fixer/releases/download/v3.66.0/php-cs-fixer.phar -O php-cs-fixer.phar
          chmod +x php-cs-fixer.phar
          sudo mv php-cs-fixer.phar /usr/local/bin/php-cs-fixer 

      - name: ℹ️ Show PHP-CS-Fixer version
        run: php-cs-fixer --version

      - name: 💅 Run Code Style Check (PHP-CS-Fixer)
        id: cs_check
        run: php-cs-fixer check
        continue-on-error: true

      - name: 📝 Save Code Style Results
        if: github.event_name == 'pull_request'
        run: |
          if [ "${{ steps.cs_check.outcome }}" == "failure" ]; then
            echo "FAILED" > cs-fixer-result.txt
          else
            echo "PASSED" > cs-fixer-result.txt
          fi

      - name: 📤 Upload Code Style Results
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: cs-fixer-result
          path: cs-fixer-result.txt
          retention-days: 1

      - name: 🔴 Fail if code style check failed
        if: steps.cs_check.outcome == 'failure'
        run: exit 1

  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php-version: ['7.4', '8.0', '8.1', '8.2']
      fail-fast: false

    services:
      mariadb:
        image: mariadb:10.10
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: o3shop_test
          MYSQL_USER: o3shop
          MYSQL_PASSWORD: o3shop
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: 🐘 Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, xml, ctype, json, tokenizer, pdo, pdo_mysql, mysqli
          coverage: pcov

      - name: ⬇️ Install Composer 2.2
        run: |
          echo "::group::Install Composer"
          php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
          php composer-setup.php --version=2.2.28
          php -r "unlink('composer-setup.php');"
          sudo mv composer.phar /usr/local/bin/composer
          composer --version
          echo "::endgroup::"

      - name: 🏷 Set Dynamic Composer Root Version
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BRANCH_NAME="${{ github.head_ref }}"
          fi
          if [[ "$BRANCH_NAME" == "main" ]]; then
            VERSION="1.4.x-dev"
          elif [[ "$BRANCH_NAME" == *"1.4"* ]]; then
            VERSION="1.4.x-dev"
          elif [[ "$BRANCH_NAME" == *"1.3"* ]]; then
            VERSION="1.3.x-dev"
          else
            VERSION="1.4.x-dev"
          fi
          echo "COMPOSER_ROOT_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Using version: $VERSION"

      - name: 📦 Cache Composer Dependencies
        id: composer-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php-version }}-

      - name: 🔧 Copy CI Config Files
        run: |
          cp .env.ci .env
          cp source/config.inc.php.dist source/config.inc.php

      - name: 📥 Install Dependencies
        env:
          COMPOSER_ROOT_VERSION: ${{ env.COMPOSER_ROOT_VERSION }}
        run: |
          echo "::group::Composer Install"
          composer install --prefer-dist --no-progress
          echo "::endgroup::"
          echo "::group::Install O3-Theme"
          composer require o3-shop/o3-theme:dev-main --prefer-dist --no-progress
          echo "::endgroup::"
          echo "::group::Apt Intall"
          sudo apt-get update
          sudo apt-get install -y libxml2-utils 
          echo "::endgroup::"

      - name: 🎨 Install Wave Theme
        run: |
          echo "::group::Wave Theme Installation"
          if [ -d "source/Application/views/wave" ] && [ "$(ls -A source/Application/views/wave)" ]; then
            echo "Wave theme already installed, skipping"
            exit 0
          fi
          wget -q https://github.com/o3-shop/wave-theme/archive/refs/heads/main.zip -O main.zip
          unzip -q main.zip
          mkdir -p source/out/
          cp -r wave-theme-main/out/* source/out/
          mkdir -p source/Application/views/wave
          rm -rf wave-theme-main/out
          cp -r wave-theme-main/* source/Application/views/wave
          rm -rf wave-theme-main main.zip
          echo "Wave theme installed"
          echo "::endgroup::"

      - name: ⏳ Wait for MariaDB (Ready Check)
        run: |
          until mysqladmin ping -h 127.0.0.1 -P 3306 -u root -proot --silent; do
            echo 'Waiting for MariaDB...'
            sleep 1
          done

      - name: 🩹 Patch Testing Library (MariaDB --skip-ssl fix)
        run: |
            sed -i "s/ --skip-ssl//g" \
            vendor/o3-shop/testing-library/library/Services/Library/DatabaseHandler.php
            echo "Verifying patch:"
            grep -n "skip-ssl" vendor/o3-shop/testing-library/library/Services/Library/DatabaseHandler.php && echo "PATCH FAILED - still found" || echo "PATCH OK - removed"

      - name: 🗄️ Create Test Database
        run: mysql -h 127.0.0.1 -P 3306 -u root -proot -e "CREATE DATABASE IF NOT EXISTS o3shop_test;"

      - name: ✅ Run PHPUnit (with Coverage)
        id: phpunit
        continue-on-error: true
        run: |
          echo "::group::PHPUnit"
          CURRENT_DIR=$(pwd)
          php $CURRENT_DIR/vendor/bin/phpunit \
            --bootstrap $CURRENT_DIR/vendor/o3-shop/testing-library/bootstrap.php \
            -c $CURRENT_DIR/tests/phpunit.xml \
            $CURRENT_DIR/tests/Unit \
            --exclude-group quarantine \
            --colors=always \
            --coverage-clover="$CURRENT_DIR/coverage.xml" \
            --coverage-html="$CURRENT_DIR/coverage-html/" \
            --log-junit="$CURRENT_DIR/junit.xml"
          echo "::endgroup::"

      - name: ☁️ Upload Coverage Report (HTML)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-php-${{ matrix.php-version }}
          path: coverage-html/

      - name: 📝 Parse Failed Tests
        id: parse_failed_tests
        run: |
          if [ -f junit.xml ]; then
            FAILURES=$(xmllint --xpath "count(//testcase[failure or error])" junit.xml 2>/dev/null || echo "0")
            ERROR_OUTPUT=$(
              xmllint --xpath '//testcase[failure or error]' junit.xml 2>/dev/null | tr '\n' ' ' | perl -ne '
              while (/<testcase\b([^>]*)>/g) {
                my $attr = $1;
                my ($class) = $attr =~ /\bclass="([^"]*)"/;
                my ($name)  = $attr =~ /\bname="([^"]*)"/;
                print "$class"."::"."$name\n" if $class && $name;
              }
              '
            )

            echo "FAILURES=$FAILURES"
            echo "ERROR_OUTPUT=$ERROR_OUTPUT"
             if [ "$FAILURES" -gt 0 ]; then
                echo "FAILED_TESTS=$ERROR_OUTPUT" >> $GITHUB_ENV
                echo "TESTS_FAILED=true" >> $GITHUB_ENV
              else
                echo "FAILED_TESTS=" >> $GITHUB_ENV
                echo "TESTS_FAILED=false" >> $GITHUB_ENV
              fi
            else
              echo "FAILED_TESTS=" >> $GITHUB_ENV
              echo "TESTS_FAILED=false" >> $GITHUB_ENV
            fi

      - name: 📝 Generate Coverage Summary
        run: |
          if [ -f coverage.xml ]; then
            COVERAGE=$(php -r "
              \$xml = simplexml_load_file('coverage.xml');
              \$metrics = \$xml->project->metrics;
              \$covered = (int)\$metrics['coveredstatements'];
              \$total = (int)\$metrics['statements'];
              \$percentage = \$total > 0 ? round((\$covered / \$total) * 100, 2) : 0;
              echo \$percentage;
            ")
            echo "## Coverage Report (PHP ${{ matrix.php-version }})" >> $GITHUB_STEP_SUMMARY
            echo "**Coverage: ${COVERAGE}%**" >> $GITHUB_STEP_SUMMARY
            echo "COVERAGE_PERCENTAGE=${COVERAGE}" >> $GITHUB_ENV
          else
            echo "No coverage file found"
          fi

      - name: 🛑 Enforce Coverage Threshold (≥ 90%)
        id: coverage_gate
        if: env.TESTS_FAILED == 'false'
        run: php bin/check-coverage-threshold.php --clover coverage.xml --threshold 90

      - name: 💡 Add failed test summary if not PR
        if: env.TESTS_FAILED == 'true' && github.event_name != 'pull_request'
        run: |
          echo "## ❌ Some PHPUnit tests failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '${{ env.FAILED_TESTS }}' >> $GITHUB_STEP_SUMMARY

      - name: 📝 Save Test Results
        if: github.event_name == 'pull_request'
        run: |
          # Create JSON result for this PHP version
          cat > test-result-${{ matrix.php-version }}.json << EOF
          {
            "php_version": "${{ matrix.php-version }}",
            "coverage": "${{ env.COVERAGE_PERCENTAGE }}",
            "tests_failed": "${{ env.TESTS_FAILED }}",
            "failed_tests": "${{ env.FAILED_TESTS }}"
          }
          EOF

      - name: 📤 Upload Test Results
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: test-result-${{ matrix.php-version }}
          path: test-result-${{ matrix.php-version }}.json
          retention-days: 1

      - name: 🔴 Fail if tests failed
        if: env.TESTS_FAILED == 'true'
        run: exit 1

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # ── Why this is NOT in the PHP matrix ──────────────────────────────────
    # The unit `test` job above runs across PHP 7.4–8.2. E2E is deliberately a
    # single job on PHP 8.2 instead, because:
    #   1. It exercises end-to-end storefront/admin BEHAVIOUR through a browser,
    #      which is effectively PHP-version-independent — version-specific logic
    #      is already covered by the unit matrix.
    #   2. The shop is served from the docker image, which is fixed at PHP 8.2,
    #      and the Playwright fixtures use `docker exec` into the shop container,
    #      so e2e inherently runs against the 8.2 container.
    #   3. Building 7.4/8.0/8.1 shop images + running the full browser suite ×4
    #      would multiply CI time (docker build + demodata provisioning + browser
    #      run) for negligible extra signal.
    # If a PHP-version-specific end-to-end concern ever appears, add a targeted
    # job on the minimum supported version (needs a 7.4 shop image).
    #
    # NOTE: first cut — validate on a PR run and tune the provisioning wait /
    # container name before making this a *required* status check.
    steps:
      - uses: actions/checkout@v4

      - name: 🔧 Prepare shop config for the docker stack
        run: |
          cp source/config.inc.php.dist source/config.inc.php
          # Docker-oriented .env (SHOPDIR=/var/www/html, DBHOST=db). SSLSHOPURL is
          # set to the literal URL — NOT "${O3SHOP_CONF_SHOPURL}" — to avoid the
          # phpdotenv forward-reference pitfall that leaves the placeholder
          # unexpanded and breaks every SSL form submit (register/checkout).
          cat > .env <<'EOF'
          O3SHOP_CONF_DBHOST="db"
          O3SHOP_CONF_DBPORT="3306"
          O3SHOP_CONF_DBNAME="o3shop"
          O3SHOP_CONF_DBUSER="o3shop"
          O3SHOP_CONF_DBPWD="o3shop"
          O3SHOP_CONF_DBROOT="supersecret"
          O3SHOP_CONF_SHOPURL="http://localhost:8080"
          O3SHOP_CONF_SSLSHOPURL="http://localhost:8080"
          O3SHOP_CONF_SHOPDIR="/var/www/html/source"
          O3SHOP_CONF_COMPILEDIR="/var/www/html/source/tmp"
          O3SHOP_CONF_ADMINSSLURL=""
          O3SHOP_CONF_LOG_LEVEL="error"
          O3SHOP_CONF_LOG_DIR="log/"
          O3SHOP_CONF_DEBUG=0
          O3SHOP_CONF_ADMINEMAIL=""
          O3SHOP_CONF_SKIPVIEWUSAGE=0
          O3SHOP_CONF_DELSETUPDIR=1
          EOF

      - name: 🐳 Start shop stack (shop + db + mailpit)
        working-directory: docker
        run: |
          docker network create o3shop-shared 2>/dev/null || true
          COMPOSE_PROJECT_NAME=o3shop docker compose --env-file ../.env --profile db up -d --build

      - name: ⏳ Wait for shop provisioning (setup + demodata)
        run: |
          # The shop container healthcheck turns "healthy" once o3 setup +
          # demodata provisioning finishes (removes /tmp/o3setup-running).
          for i in $(seq 1 120); do
            status=$(docker inspect -f '{{.State.Health.Status}}' o3shop-shop-1 2>/dev/null || echo "starting")
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/ || echo 000)
            echo "attempt $i: health=$status http=$code"
            if [ "$status" = "healthy" ] && [ "$code" = "200" ]; then echo "shop ready"; break; fi
            if [ "$i" = "120" ]; then echo "::error::shop not ready"; docker logs o3shop-shop-1 --tail 200 || true; exit 1; fi
            sleep 5
          done

      - name: 🟢 Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📥 Install Playwright + Chromium
        working-directory: tests/Acceptance/playwright
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium

      - name: 🎭 Run Playwright e2e (CI=1 → 2 retries absorb known mail-timing flakiness)
        working-directory: tests/Acceptance/playwright
        env:
          SHOP_URL: http://localhost:8080
          MAILPIT_URL: http://localhost:8025
          SHOP_CONTAINER: o3shop-shop-1
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: o3shop
          DB_USER: root
          DB_PASS: supersecret
          CI: '1'
        run: npx playwright test

      - name: 📤 Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/Acceptance/playwright/playwright-report/
            tests/Acceptance/playwright/test-results/
          retention-days: 7

