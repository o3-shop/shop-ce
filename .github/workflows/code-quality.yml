name: Code Quality

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  cs-fixer:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 🐘 Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: ⬇️ Download PHP-CS-Fixer
        run: |
          wget -q https://github.com/FriendsOfPHP/PHP-CS-Fixer/releases/download/v3.66.0/php-cs-fixer.phar -O php-cs-fixer.phar
          chmod +x php-cs-fixer.phar
          sudo mv php-cs-fixer.phar /usr/local/bin/php-cs-fixer 

      - name: ℹ️ Show PHP-CS-Fixer version
        run: php-cs-fixer --version

      - name: 💅 Run Code Style Check (PHP-CS-Fixer)
        id: cs_check
        run: php-cs-fixer check
        continue-on-error: true

      - name: 📝 Save Code Style Results
        if: github.event_name == 'pull_request'
        run: |
          if [ "${{ steps.cs_check.outcome }}" == "failure" ]; then
            echo "FAILED" > cs-fixer-result.txt
          else
            echo "PASSED" > cs-fixer-result.txt
          fi

      - name: 📤 Upload Code Style Results
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: cs-fixer-result
          path: cs-fixer-result.txt
          retention-days: 1

      - name: 🔴 Fail if code style check failed
        if: steps.cs_check.outcome == 'failure'
        run: exit 1

  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php-version: ['7.4', '8.0', '8.1', '8.2']
      fail-fast: false

    services:
      mariadb:
        image: mariadb:10.10
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: o3shop_test
          MYSQL_USER: o3shop
          MYSQL_PASSWORD: o3shop
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: 🐘 Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, xml, ctype, json, tokenizer, pdo, pdo_mysql, mysqli
          coverage: pcov

      - name: ⬇️ Install Composer 2.2
        run: |
          echo "::group::Install Composer"
          php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
          php composer-setup.php --version=2.2.28
          php -r "unlink('composer-setup.php');"
          sudo mv composer.phar /usr/local/bin/composer
          composer --version
          echo "::endgroup::"

      - name: 🏷 Set Dynamic Composer Root Version
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BRANCH_NAME="${{ github.head_ref }}"
          fi
          if [[ "$BRANCH_NAME" == "main" ]]; then
            VERSION="1.4.x-dev"
          elif [[ "$BRANCH_NAME" == *"1.4"* ]]; then
            VERSION="1.4.x-dev"
          elif [[ "$BRANCH_NAME" == *"1.3"* ]]; then
            VERSION="1.3.x-dev"
          else
            VERSION="1.4.x-dev"
          fi
          echo "COMPOSER_ROOT_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Using version: $VERSION"

      - name: 📦 Cache Composer Dependencies
        id: composer-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php-version }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php-version }}-

      - name: 🔧 Copy CI Config Files
        run: |
          cp .env.ci .env
          cp source/config.inc.php.dist source/config.inc.php

      - name: 📥 Install Dependencies
        env:
          COMPOSER_ROOT_VERSION: ${{ env.COMPOSER_ROOT_VERSION }}
        run: |
          echo "::group::Composer Install"
          composer install --prefer-dist --no-progress
          echo "::endgroup::"
          echo "::group::Install O3-Theme"
          composer require o3-shop/o3-theme:dev-main --prefer-dist --no-progress
          echo "::endgroup::"
          echo "::group::Apt Intall"
          sudo apt-get update
          sudo apt-get install -y libxml2-utils 
          echo "::endgroup::"

      - name: 🎨 Install Wave Theme
        run: |
          echo "::group::Wave Theme Installation"
          if [ -d "source/Application/views/wave" ] && [ "$(ls -A source/Application/views/wave)" ]; then
            echo "Wave theme already installed, skipping"
            exit 0
          fi
          wget -q https://github.com/o3-shop/wave-theme/archive/refs/heads/main.zip -O main.zip
          unzip -q main.zip
          mkdir -p source/out/
          cp -r wave-theme-main/out/* source/out/
          mkdir -p source/Application/views/wave
          rm -rf wave-theme-main/out
          cp -r wave-theme-main/* source/Application/views/wave
          rm -rf wave-theme-main main.zip
          echo "Wave theme installed"
          echo "::endgroup::"

      - name: ⏳ Wait for MariaDB (Ready Check)
        run: |
          until mysqladmin ping -h 127.0.0.1 -P 3306 -u root -proot --silent; do
            echo 'Waiting for MariaDB...'
            sleep 1
          done

      - name: 🩹 Patch Testing Library (MariaDB --skip-ssl fix)
        run: |
            sed -i "s/ --skip-ssl//g" \
            vendor/o3-shop/testing-library/library/Services/Library/DatabaseHandler.php
            echo "Verifying patch:"
            grep -n "skip-ssl" vendor/o3-shop/testing-library/library/Services/Library/DatabaseHandler.php && echo "PATCH FAILED - still found" || echo "PATCH OK - removed"

      - name: 🗄️ Create Test Database
        run: mysql -h 127.0.0.1 -P 3306 -u root -proot -e "CREATE DATABASE IF NOT EXISTS o3shop_test;"

      - name: ✅ Run PHPUnit (with Coverage)
        id: phpunit
        continue-on-error: true
        run: |
          echo "::group::PHPUnit"
          CURRENT_DIR=$(pwd)
          php $CURRENT_DIR/vendor/bin/phpunit \
            --bootstrap $CURRENT_DIR/vendor/o3-shop/testing-library/bootstrap.php \
            -c $CURRENT_DIR/tests/phpunit.xml \
            $CURRENT_DIR/tests/Unit \
            --exclude-group quarantine \
            --colors=always \
            --coverage-clover="$CURRENT_DIR/coverage.xml" \
            --coverage-html="$CURRENT_DIR/coverage-html/" \
            --log-junit="$CURRENT_DIR/junit.xml"
          echo "::endgroup::"

      - name: ☁️ Upload Coverage Report (HTML)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-php-${{ matrix.php-version }}
          path: coverage-html/

      - name: 📝 Parse Failed Tests
        id: parse_failed_tests
        run: |
          if [ -f junit.xml ]; then
            FAILURES=$(xmllint --xpath "count(//testcase[failure or error])" junit.xml 2>/dev/null || echo "0")
            ERROR_OUTPUT=$(
              xmllint --xpath '//testcase[failure or error]' junit.xml 2>/dev/null | tr '\n' ' ' | perl -ne '
              while (/<testcase\b([^>]*)>/g) {
                my $attr = $1;
                my ($class) = $attr =~ /\bclass="([^"]*)"/;
                my ($name)  = $attr =~ /\bname="([^"]*)"/;
                print "$class"."::"."$name\n" if $class && $name;
              }
              '
            )

            echo "FAILURES=$FAILURES"
            echo "ERROR_OUTPUT=$ERROR_OUTPUT"
             if [ "$FAILURES" -gt 0 ]; then
                echo "FAILED_TESTS=$ERROR_OUTPUT" >> $GITHUB_ENV
                echo "TESTS_FAILED=true" >> $GITHUB_ENV
              else
                echo "FAILED_TESTS=" >> $GITHUB_ENV
                echo "TESTS_FAILED=false" >> $GITHUB_ENV
              fi
            else
              echo "FAILED_TESTS=" >> $GITHUB_ENV
              echo "TESTS_FAILED=false" >> $GITHUB_ENV
            fi

      - name: 📝 Generate Coverage Summary
        run: |
          if [ -f coverage.xml ]; then
            COVERAGE=$(php -r "
              \$xml = simplexml_load_file('coverage.xml');
              \$metrics = \$xml->project->metrics;
              \$covered = (int)\$metrics['coveredstatements'];
              \$total = (int)\$metrics['statements'];
              \$percentage = \$total > 0 ? round((\$covered / \$total) * 100, 2) : 0;
              echo \$percentage;
            ")
            echo "## Coverage Report (PHP ${{ matrix.php-version }})" >> $GITHUB_STEP_SUMMARY
            echo "**Coverage: ${COVERAGE}%**" >> $GITHUB_STEP_SUMMARY
            echo "COVERAGE_PERCENTAGE=${COVERAGE}" >> $GITHUB_ENV
          else
            echo "No coverage file found"
          fi

      - name: 🛑 Enforce Coverage Threshold (≥ 90%)
        id: coverage_gate
        if: env.TESTS_FAILED == 'false'
        run: php bin/check-coverage-threshold.php --clover coverage.xml --threshold 90

      - name: 💡 Add failed test summary if not PR
        if: env.TESTS_FAILED == 'true' && github.event_name != 'pull_request'
        run: |
          echo "## ❌ Some PHPUnit tests failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '${{ env.FAILED_TESTS }}' >> $GITHUB_STEP_SUMMARY

      - name: 📝 Save Test Results
        if: github.event_name == 'pull_request'
        run: |
          # Create JSON result for this PHP version
          cat > test-result-${{ matrix.php-version }}.json << EOF
          {
            "php_version": "${{ matrix.php-version }}",
            "coverage": "${{ env.COVERAGE_PERCENTAGE }}",
            "tests_failed": "${{ env.TESTS_FAILED }}",
            "failed_tests": "${{ env.FAILED_TESTS }}"
          }
          EOF

      - name: 📤 Upload Test Results
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: test-result-${{ matrix.php-version }}
          path: test-result-${{ matrix.php-version }}.json
          retention-days: 1

      - name: 🔴 Fail if tests failed
        if: env.TESTS_FAILED == 'true'
        run: exit 1

  e2e:
    name: E2E (Playwright, native)
    runs-on: ubuntu-latest
    # ── Native e2e — NOT in the PHP matrix ────────────────────────────────────
    # Replicates the docker entrypoint's provisioning (composer + satellites +
    # bin/o3-setup + themes) directly on the runner, serves the shop with Apache
    # (mod_php + mod_rewrite for OXID SEO URLs), and runs Playwright with
    # E2E_SHOP_EXEC=native so the harness runs its oe-console/php helpers on the
    # host instead of `docker exec`. Single 8.2 job: e2e behaviour is
    # PHP-version-independent (the unit matrix covers versions) and the suite is
    # slow, so a per-version browser run adds cost without signal.
    #
    # ⚠ FIRST CUT — needs a PR dry-run to green. Likely tuning spots:
    #   (a) Apache+mod_php serving OXID SEO URLs (AllowOverride / .htaccess),
    #   (b) bin/o3-setup completing non-interactively against the service DB,
    #   (c) PHP mail() → Mailpit via the msmtp sendmail shim.
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: o3shop_test
          MYSQL_USER: o3shop
          MYSQL_PASSWORD: o3shop
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
      mailpit:
        image: axllent/mailpit
        ports:
          - 8025:8025
          - 1025:1025
    env:
      COMPOSER_ROOT_VERSION: dev-b-1.6
    steps:
      - uses: actions/checkout@v4

      - name: 🐘 Install PHP 8.2 + Apache (mod_php) + msmtp
        run: |
          sudo add-apt-repository -y ppa:ondrej/php
          sudo apt-get update
          sudo apt-get install -y apache2 libapache2-mod-php8.2 \
            php8.2 php8.2-mysql php8.2-gd php8.2-curl php8.2-mbstring php8.2-xml \
            php8.2-intl php8.2-soap php8.2-bcmath php8.2-zip php8.2-bz2 \
            libxml2-utils default-mysql-client msmtp msmtp-mta unzip git
          sudo update-alternatives --set php /usr/bin/php8.2 || true
          php -v

      - name: 📮 Route PHP mail() → Mailpit (msmtp shim)
        run: |
          printf 'defaults\nhost 127.0.0.1\nport 1025\ntls off\nauth off\nfrom ci@localhost\naccount default\n' \
            | sudo tee /etc/msmtprc >/dev/null
          echo 'sendmail_path = "/usr/bin/msmtp -t"' \
            | sudo tee /etc/php/8.2/apache2/conf.d/99-mailpit.ini /etc/php/8.2/cli/conf.d/99-mailpit.ini >/dev/null

      - name: ⬇️ Install Composer 2.2
        run: |
          php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
          php composer-setup.php --version=2.2.28
          php -r "unlink('composer-setup.php');"
          sudo mv composer.phar /usr/local/bin/composer
          composer --version

      - name: 📥 Install dependencies + o3-theme
        run: |
          composer install --prefer-dist --no-progress --optimize-autoloader
          composer require o3-shop/o3-theme:dev-main --prefer-dist --no-progress

      - name: 🧩 Clone satellites (testing-library, demodata) + symlinks
        run: |
          git clone --branch b-1.6 --depth 1 https://github.com/o3-shop/testing-library.git testing-library
          rm -rf vendor/o3-shop/testing-library
          ln -s ../../testing-library vendor/o3-shop/testing-library
          [ -e testing-library/vendor ] || ln -s ../vendor testing-library/vendor
          sed -i "s/ --skip-ssl//g" testing-library/library/Services/Library/DatabaseHandler.php || true
          git clone --branch main --depth 1 https://github.com/o3-shop/shop-demodata-ce.git shop-demodata-ce
          rm -rf vendor/o3-shop/shop-demodata-ce
          ln -s ../../shop-demodata-ce vendor/o3-shop/shop-demodata-ce

      - name: 🎨 Install wave theme + o3-theme out symlinks
        run: |
          git clone --branch main --depth 1 https://github.com/o3-shop/wave-theme.git source/Application/views/wave
          mkdir -p source/out
          ln -sf ../Application/views/wave/out/wave source/out/wave
          ln -sf ../Application/views/o3-theme/out/o3-theme source/out/o3-theme || true

      - name: 🔧 Shop config (.env.ci) + bin/o3-setup (schema + demodata)
        run: |
          cp .env.ci .env
          cp source/config.inc.php.dist source/config.inc.php
          for i in $(seq 1 30); do
            mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -proot --silent && { echo "db ready"; break; }
            echo "waiting for db... ($i/30)"
            if [ "$i" = "30" ]; then echo "::error::database not reachable"; exit 1; fi
            sleep 2
          done
          mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS o3shop_test;"
          php bin/o3-setup

      - name: 🌐 Serve the shop with Apache on :8080
        run: |
          sudo a2enmod rewrite
          sudo tee /etc/apache2/sites-available/o3shop.conf >/dev/null <<APACHE
          Listen 8080
          <VirtualHost *:8080>
            DocumentRoot ${GITHUB_WORKSPACE}/source
            <Directory ${GITHUB_WORKSPACE}/source>
              AllowOverride All
              Require all granted
            </Directory>
          </VirtualHost>
          APACHE
          sudo a2dissite 000-default || true
          sudo a2ensite o3shop
          sudo chmod -R a+rX "${GITHUB_WORKSPACE}/source"
          sudo chown -R www-data:www-data "${GITHUB_WORKSPACE}/source/tmp" "${GITHUB_WORKSPACE}/source/log" 2>/dev/null || true
          # Apache (www-data) writes the runtime + anti-spam caches here, but the
          # Playwright helpers run as 'runner' and delete them between tests.
          # Unlink is governed by the *directory* mode, not file ownership, so make
          # tmp/log world-writable — otherwise runner hits EACCES clearing caches.
          sudo chmod -R 777 "${GITHUB_WORKSPACE}/source/tmp" "${GITHUB_WORKSPACE}/source/log" 2>/dev/null || true
          # Apache runs as www-data; it must be able to *traverse* every dir from
          # / down to the docroot. The runner home ($GITHUB_WORKSPACE lives under
          # /home/runner/work) lacks the o+x search bit, so grant it on each
          # ancestor component (o+x on a dir only permits traversal, not listing).
          d="${GITHUB_WORKSPACE}/source"
          while [ "$d" != "/" ]; do sudo chmod o+x "$d"; d=$(dirname "$d"); done
          sudo service apache2 restart
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/ || echo 000)
            echo "apache attempt $i: http=$code"
            [ "$code" = "200" ] && { echo "shop serving"; break; }
            if [ "$i" = "30" ]; then echo "::error::shop not serving"; sudo tail -100 /var/log/apache2/error.log 2>/dev/null; cat /tmp/php_errors.log 2>/dev/null; exit 1; fi
            sleep 3
          done

      - name: 🟢 Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📥 Install Playwright + Chromium
        working-directory: tests/Acceptance/playwright
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium

      - name: 🎭 Run Playwright e2e (native; CI=1 → 2 retries absorb mail-timing flakiness)
        working-directory: tests/Acceptance/playwright
        env:
          E2E_SHOP_EXEC: native
          SHOP_ROOT: ${{ github.workspace }}
          SHOP_URL: http://localhost:8080
          MAILPIT_URL: http://localhost:8025
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: o3shop_test
          DB_USER: root
          DB_PASS: root
          CI: '1'
        run: npx playwright test

      - name: 📤 Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/Acceptance/playwright/playwright-report/
            tests/Acceptance/playwright/test-results/
          retention-days: 7
